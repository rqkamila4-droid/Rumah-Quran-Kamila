<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2b394a">
    <title>Data Santri - RQ Kamila</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        /* --- UPDATE UTAMA: PEMUSATAN KOTAK MODAL (ANTI-GESER LANDSCAPE) --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            /* Menghilangkan margin auto lama, gunakan CSS Pemusatan Murni */
            -webkit-perspective: 1000px; perspective: 1000px;
        }

        .modal-content {
            background-color: var(--card-bg);
            /* Posisi Absolut Pusat */
            position: absolute;
            top: 50%;
            left: 50%;
            -webkit-transform: translate(-50%, -50%) scale(0.9);
            transform: translate(-50%, -50%) scale(0.9);
            /* Hapus margin */
            margin: 0 !important;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            /* Batasi tinggi maksimal agar konten bisa di-scroll di landscape iPad */
            max-height: 90dvh; 
            overflow-y: auto;
            opacity: 0;
            transition: transform 0.3s ease-out, opacity 0.3s ease-out, -webkit-transform 0.3s ease-out;
            box-sizing: border-box;
        }

        /* Kelas untuk memicu animasi muncul (digunakan via JS) */
        .modal[style*="display: block"] .modal-content,
        .modal[style*="display: flex"] .modal-content {
            -webkit-transform: translate(-50%, -50%) scale(1);
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* --- UPDATE: Input Jam Lebih Kecil & Rapi --- */
        .time-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .time-input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .time-input {
            width: 100%;
            height: 38px; /* Perkecil tinggi */
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.85rem; /* Perkecil font */
            background: #f4f7f6;
            color: var(--text-main);
            box-sizing: border-box;
            outline: none;
            -webkit-appearance: none; /* Paksa Safari iPad */
        }
        .time-input:focus { border-color: var(--color-mint-dark); background: white; }
        
        /* label jam diperkecil */
        .time-label {
            font-size: 0.75rem !important;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Desain Hari Bentuk Bulat Kecil (Sesuai Referensi) */
        .day-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 5px;
            justify-content: flex-start;
        }
        .day-pill {
            display: inline-block;
            width: 35px; height: 35px; /* Perkecil ukuran */
            border-radius: 50%;
            background: transparent;
            border: 1px solid #7f8c8d;
            color: #7f8c8d;
            text-align: center;
            line-height: 35px; 
            font-size: 0.7rem; /* Perkecil font */
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .hari-chk { display: none; }
        .hari-chk:checked + .day-pill {
            background: var(--color-mint-dark);
            color: white;
            border-color: var(--color-mint-dark);
        }

        /* Perbaikan Daftar Dapodik rata kiri & Checkbox konsisten */
        .dapodik-item {
            display: flex;
            align-items: flex-start;
            text-align: left; /* Paksa teks ke kiri */
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
            gap: 15px;
        }
        .dapodik-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            margin-top: 3px;
            accent-color: var(--color-mint-dark);
            cursor: pointer;
        }
        .dapodik-info { flex: 1; }
    </style>
</head>
<body class="admin-layout">

    <div id="kelasModal" class="modal">
        <div class="modal-content" style="width: 90%; max-width: 400px; padding: 25px;">
            <span class="close-modal" id="closeKelasModal">&times;</span>
            <h3 class="modal-title" style="border:none; text-align:center; font-weight:700; margin-bottom: 15px;">Buat Kelas Baru</h3>
            
            <div class="input-group" style="margin-bottom: 15px;">
                <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-main);">Nama Kelas</label>
                <input type="text" id="inputNamaKelas" placeholder="Misal: Al-Baqarah 1" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: #f4f7f6;">
            </div>
            
            <div class="time-input-container">
                <div class="time-input-wrapper">
                    <label class="time-label">Jam Mulai</label>
                    <input type="time" id="inputJamMulai" class="time-input">
                </div>
                <div style="color: var(--text-muted); margin-top: 18px; font-weight: bold;">-</div>
                <div class="time-input-wrapper">
                    <label class="time-label">Jam Selesai</label>
                    <input type="time" id="inputJamSelesai" class="time-input">
                </div>
            </div>

            <div class="input-group" style="margin-bottom: 25px;">
                <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-main);">Hari Belajar</label>
                <div class="day-pills">
                    <input type="checkbox" id="hari_sen" class="hari-chk" value="Senin"><label for="hari_sen" class="day-pill">Sen</label>
                    <input type="checkbox" id="hari_sel" class="hari-chk" value="Selasa"><label for="hari_sel" class="day-pill">Sel</label>
                    <input type="checkbox" id="hari_rab" class="hari-chk" value="Rabu"><label for="hari_rab" class="day-pill">Rab</label>
                    <input type="checkbox" id="hari_kam" class="hari-chk" value="Kamis"><label for="hari_kam" class="day-pill">Kam</label>
                    <input type="checkbox" id="hari_jum" class="hari-chk" value="Jumat"><label for="hari_jum" class="day-pill">Jum</label>
                    <input type="checkbox" id="hari_sab" class="hari-chk" value="Sabtu"><label for="hari_sab" class="day-pill">Sab</label>
                    <input type="checkbox" id="hari_ahd" class="hari-chk" value="Ahad"><label for="hari_ahd" class="day-pill">Ahd</label>
                </div>
            </div>
            
            <button class="btn-save-all" id="btnSimpanKelas" style="width: 100%; border-radius: 30px; margin:0;">
                <i class="fas fa-plus-circle"></i> Buat Kelas Baru
            </button>
        </div>
    </div>

    <div id="santriModal" class="modal">
        <div class="modal-content" style="width: 95%; max-width: 500px; display: flex; flex-direction: column; padding: 0;">
            
            <div style="padding: 20px 25px 10px 25px; flex-shrink: 0;">
                <span class="close-modal" id="closeSantriModal" style="margin-top: -5px;">&times;</span>
                <h3 class="modal-title">Tarik Santri ke Kelas</h3>
                
                <div class="input-group" style="margin-bottom: 15px;">
                    <label style="font-size: 0.8rem; font-weight: 600;">Masukkan ke Kelas:</label>
                    <select id="selectKelasTarget" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: #f4f7f6;">
                        </select>
                </div>

                <label style="font-size: 0.8rem; font-weight: 600;">Pilih Santri dari Dapodik:</label>
                <div class="search-box" style="margin-bottom: 10px; position: relative;">
                    <i class="fas fa-search" style="left: 15px; top: 50%; transform: translateY(-50%); position: absolute; color: var(--text-muted);"></i>
                    <input type="text" id="searchDapodik" placeholder="Cari NIS/Nama..." style="width: 100%; padding: 10px 10px 10px 40px; border: 1px solid #ddd; border-radius: 8px;">
                </div>
            </div>
            
            <div id="dapodikListContainer" style="overflow-y: auto; flex: 1; min-height: 150px; padding: 0 25px; background: #fafafa; border-top: 1px solid #eee; border-bottom: 1px solid #eee; box-sizing: border-box;">
                <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 20px;">Memuat data Dapodik...</div>
            </div>
            
            <div style="padding: 15px 25px; background: white; border-radius: 0 0 15px 15px; flex-shrink: 0;">
                <button class="btn-save-all" id="btnSimpanTarikSantri" style="width: 100%; margin: 0; border-radius: 30px;">
                    <i class="fas fa-save"></i> Simpan ke Kelas Saya
                </button>
            </div>
        </div>
    </div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="logorqkamila.png" alt="Logo" class="brand-logo">
            <span class="brand-text">RQ Kamila</span>
            <button class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fas fa-border-all"></i> <span>Dashboard</span></a></li>
            <li class="active"><a href="data-santri.html"><i class="fas fa-user-graduate"></i> <span>Data Santri</span></a></li>
            <li><a href="presensi.html"><i class="fas fa-clipboard-list"></i> <span>Input Harian</span></a></li>
            <li><a href="#"><i class="fas fa-chart-pie"></i> <span>Laporan</span></a></li>
            <li><a href="#"><i class="fas fa-cog"></i> <span>Pengaturan</span></a></li>
        </ul>
        <div class="sidebar-bottom">
            <a href="login.html" class="logout-btn" id="btnLogout"><i class="fas fa-sign-out-alt"></i> <span>Keluar</span></a>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <h2 class="page-title">Santri Binaan</h2>
            </div>
            <div class="topbar-right" style="display: flex; gap: 10px;">
                <button class="btn-save-sm" id="btnBuatKelas" style="background-color: var(--color-blue); color: var(--text-main);">
                    <i class="fas fa-plus"></i> Kelas
                </button>
                <button class="btn-save-sm" id="btnTarikSantri" style="background-color: var(--color-mint-dark); color: white;">
                    <i class="fas fa-download"></i> Santri
                </button>
            </div>
        </header>

        <div class="dashboard-wrapper">
            <div class="card filter-card">
                <div class="search-box" style="flex: 2; min-width: 250px;">
                    <i class="fas fa-search" style="left: 15px;"></i>
                    <input type="text" id="searchSantri" placeholder="Cari nama santri binaan..." style="width: 100%; background: white;">
                </div>
                <div class="filter-group" style="flex: 1;">
                    <select id="filterKelasTable" class="filter-select" style="background: white;">
                        <option value="semua">Semua Kelas Binaan</option>
                    </select>
                </div>
            </div>

            <div class="card" style="padding: 0; overflow: hidden;">
                <div style="overflow-x: auto;">
                    <table class="santri-table">
                        <thead>
                            <tr>
                                <th>NIS</th>
                                <th>Nama Santri</th>
                                <th>Kelas</th>
                                <th>L/P</th>
                                <th style="text-align: center;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="santriTableBody">
                            <tr><td colspan="5" style="text-align: center;">Memuat data santri binaan Anda...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <script src="data-santri.js"></script>
</body>
</html>
