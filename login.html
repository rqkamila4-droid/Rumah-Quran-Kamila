<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2b394a">
    <title>Masuk - RQ Kamila</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #2b394a; /* Warna biru gelap RQ Kamila */
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #333;
        }

        .login-card {
            background: white; width: 90%; max-width: 400px; padding: 40px 30px;
            border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center; box-sizing: border-box;
        }

        .login-logo {
            width: 100px; height: 100px; object-fit: contain; margin-bottom: 10px;
        }

        .login-title { font-size: 1.5rem; font-weight: 700; color: #1a252f; margin: 0 0 5px 0; }
        .login-subtitle { font-size: 0.85rem; color: #7f8c8d; margin-bottom: 30px; }

        .input-group { text-align: left; margin-bottom: 20px; position: relative; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #34495e; margin-bottom: 8px; }
        
        .input-group input {
            width: 100%; padding: 12px 15px 12px 40px; border: 1px solid #e1e5eb;
            border-radius: 8px; font-family: inherit; font-size: 0.95rem; box-sizing: border-box;
            background: #fafafa; transition: 0.3s;
        }

        .input-group input:focus {
            outline: none; border-color: #2ca58d; background: #fff;
            box-shadow: 0 0 0 3px rgba(44, 165, 141, 0.1);
        }

        /* Ikon Kiri */
        .input-group i.icon-left { position: absolute; bottom: 14px; left: 15px; color: #95a5a6; }
        /* Ikon Kanan (Mata) */
        .input-group i.icon-right { position: absolute; bottom: 14px; right: 15px; color: #95a5a6; cursor: pointer; }

        .btn-login {
            width: 100%; background: #2ca58d; color: white; border: none; padding: 14px;
            border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer;
            margin-top: 10px; transition: 0.3s;
        }
        .btn-login:hover { background: #218c76; transform: translateY(-2px); }

        .error-msg {
            color: #e74c3c; font-size: 0.85rem; margin-top: 15px; display: none;
            background: rgba(231, 76, 60, 0.1); padding: 10px; border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="logorqkamila.png?v=5" alt="Logo RQ Kamila" class="login-logo" onerror="this.src='https://ui-avatars.com/api/?name=RQ&background=2b394a&color=fff'">
        
        <h1 class="login-title">RQ Kamila</h1>
        <p class="login-subtitle">Sistem Informasi Akademik Santri</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Username Ustadz</label>
                <i class="fas fa-user icon-left"></i>
                <input type="text" id="username" placeholder="Contoh: reyndi" required>
            </div>
            
            <div class="input-group">
                <label>Kata Sandi</label>
                <i class="fas fa-lock icon-left"></i>
                <input type="password" id="password" placeholder="Masukkan kata sandi..." required>
                <i class="far fa-eye icon-right" onclick="togglePass()" id="eyeIcon"></i>
            </div>

            <div id="pesanError" class="error-msg">Username atau kata sandi salah.</div>

            <button type="submit" class="btn-login" id="btnLogin">Masuk ke Dashboard</button>
        </form>
    </div>

    <script>
        function togglePass() {
            const p = document.getElementById('password');
            const eye = document.getElementById('eyeIcon');
            if (p.type === 'password') {
                p.type = 'text';
                eye.classList.remove('fa-eye');
                eye.classList.add('fa-eye-slash');
            } else {
                p.type = 'password';
                eye.classList.remove('fa-eye-slash');
                eye.classList.add('fa-eye');
            }
        }
    </script>

    <script src="login.js"></script>
</body>
</html>
