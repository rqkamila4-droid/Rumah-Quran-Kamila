<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#99DDCC">
    <title>Login Ustadz - Rumah Quran Kamila</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- CSS Link (Menggunakan file yang sama) -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <!-- Logo -->
        <img src="kamila.png" alt="Logo RQ Kamila" class="login-logo">
        
        <h2 class="login-title">Masuk Akun</h2>
        <p class="login-subtitle">Silakan masuk untuk mengakses Dashboard Ustadz</p>

        <!-- Form Login -->
        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label for="email">Email / Username</label>
                <input type="text" id="email" placeholder="Masukkan email ustadz" required>
            </div>
            
            <div class="input-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" placeholder="Masukkan kata sandi" required>
            </div>

            <div class="form-actions">
                <a href="#" class="forgot-password">Lupa sandi?</a>
            </div>

            <button type="submit" class="btn-login">Masuk</button>
        </form>
    </div>

    <!-- Script khusus halaman login -->
    <script src="login.js"></script>
</body>
</html>
