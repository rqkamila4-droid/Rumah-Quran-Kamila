<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#99DDCC">
    <title>Dashboard Ustadz - RQ Kamila</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <!-- Bagian Header / Profil Ustadz -->
    <header class="dashboard-header">
        <div class="header-text">
            <p class="greeting">Ahlan wa Sahlan,</p>
            <h1 class="ustadz-name">Ustadz Fulan</h1> <!-- Nanti nama ini dinamis dari Supabase -->
            <p class="date-today" id="dateToday">Senin, 1 Muharram 1445 H</p>
        </div>
        <div class="header-logo">
            <img src="logorqkamila.png" alt="Logo">
        </div>
    </header>

    <!-- Bagian Menu Utama -->
    <main class="dashboard-main">
        <h3 class="section-title">Menu Utama</h3>
        
        <div class="menu-grid">
            <!-- Menu 1: Data Santri -->
            <div class="menu-card" id="menu-santri">
                <div class="icon-wrapper"><i class="fas fa-users"></i></div>
                <span>Data Santri</span>
            </div>

            <!-- Menu 2: Input Presensi -->
            <div class="menu-card" id="menu-presensi">
                <div class="icon-wrapper"><i class="fas fa-user-check"></i></div>
                <span>Presensi</span>
            </div>

            <!-- Menu 3: Input Tahfidz -->
            <div class="menu-card" id="menu-tahfidz">
                <div class="icon-wrapper"><i class="fas fa-book-quran"></i></div>
                <span>Tahfidz</span>
            </div>

            <!-- Menu 4: Input Tahsin -->
            <div class="menu-card" id="menu-tahsin">
                <div class="icon-wrapper"><i class="fas fa-microphone-lines"></i></div>
                <span>Tahsin</span>
            </div>

            <!-- Menu 5: Input Darsah -->
            <div class="menu-card" id="menu-darsah">
                <div class="icon-wrapper"><i class="fas fa-chalkboard-teacher"></i></div>
                <span>Darsah</span>
            </div>

            <!-- Menu 6: Riwayat Aktifitas -->
            <div class="menu-card" id="menu-riwayat">
                <div class="icon-wrapper"><i class="fas fa-history"></i></div>
                <span>Riwayat</span>
            </div>

            <!-- Menu 7: Laporan/Evaluasi -->
            <div class="menu-card" id="menu-laporan">
                <div class="icon-wrapper"><i class="fas fa-chart-pie"></i></div>
                <span>Laporan</span>
            </div>
            
            <!-- Tombol Keluar (Logout) -->
            <div class="menu-card logout-card" id="btn-logout">
                <div class="icon-wrapper"><i class="fas fa-sign-out-alt"></i></div>
                <span>Keluar</span>
            </div>
        </div>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
