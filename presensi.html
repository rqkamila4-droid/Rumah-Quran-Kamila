<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2b394a">
    <title>Input Harian - RQ Kamila</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        /* Gaya khusus untuk halaman absen */
        .presensi-table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .presensi-table th, .presensi-table td { padding: 12px 10px; border-bottom: 1px solid #eee; text-align: center; font-size: 0.85rem; }
        .presensi-table th { background: #f8fbfb; font-weight: 600; color: var(--text-muted); }
        .presensi-table td:first-child { text-align: left; }
        
        .radio-absen { display: flex; gap: 8px; justify-content: center; }
        .radio-absen label { 
            width: 30px; height: 30px; border-radius: 5px; border: 1px solid #ddd; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .radio-absen input { display: none; }
        .radio-absen input[value="H"]:checked + label { background: #27ae60; color: white; border-color: #27ae60; }
        .radio-absen input[value="I"]:checked + label { background: #f39c12; color: white; border-color: #f39c12; }
        .radio-absen input[value="S"]:checked + label { background: #3498db; color: white; border-color: #3498db; }
        .radio-absen input[value="A"]:checked + label { background: #e74c3c; color: white; border-color: #e74c3c; }

        .input-mini { width: 60px; padding: 5px; border: 1px solid #ddd; border-radius: 4px; text-align: center; }
        .input-text { width: 100%; padding: 5px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }

        /* Pesan Libur */
        .libur-banner { background: #ffeaa7; color: #d35400; padding: 20px; text-align: center; border-radius: 8px; margin: 20px; font-weight: 600; border: 1px dashed #f1c40f; }
        
        /* Opsi Libur Modal */
        .radio-group-libur { display: flex; gap: 15px; margin-bottom: 15px; }
        .radio-group-libur label { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.85rem;}
        .radio-group-libur input { display: none; }
        .radio-group-libur input:checked + label { background: #e74c3c; color: white; border-color: #e74c3c; }
    </style>
</head>
<body class="admin-layout">

    <div id="modalLibur" class="modal">
        <div class="modal-content" style="width: 90%; max-width: 400px;">
            <span class="close-modal" id="closeModalLibur">&times;</span>
            <h3 style="margin-bottom: 20px; text-align: center; color: #e74c3c;"><i class="fas fa-calendar-times"></i> Atur Libur / Udzur</h3>
            
            <div class="input-group" style="margin-bottom: 15px;">
                <label style="font-size: 0.8rem; font-weight: 600;">Tanggal Libur</label>
                <input type="date" id="inputTglLibur" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
            </div>

            <div class="input-group" style="margin-bottom: 15px;">
                <label style="font-size: 0.8rem; font-weight: 600;">Alasan</label>
                <select id="selectAlasanLibur" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
                    <option value="Ustadz Sakit">Ustadz Sakit</option>
                    <option value="Ustadz Izin (Ada Keperluan)">Ustadz Izin (Ada Keperluan)</option>
                    <option value="Libur Nasional">Libur Nasional</option>
                </select>
            </div>

            <div class="input-group" style="margin-bottom: 15px;">
                <label style="font-size: 0.8rem; font-weight: 600;">Cakupan Libur</label>
                <div class="radio-group-libur">
                    <input type="radio" name="cakupan_libur" id="libur_semua" value="semua" checked>
                    <label for="libur_semua">Semua Kelas</label>
                    
                    <input type="radio" name="cakupan_libur" id="libur_sebagian" value="sebagian">
                    <label for="libur_sebagian">Pilih Kelas</label>
                </div>
            </div>

            <div id="containerPilihKelas" style="display: none; background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 15px; max-height: 120px; overflow-y: auto;">
                </div>

            <button id="btnSimpanLibur" style="width: 100%; padding: 12px; border: none; border-radius: 8px; background: #e74c3c; color: white; font-weight: bold; cursor: pointer;">
                Simpan Status Libur
            </button>
        </div>
    </div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="logorqkamila.png?v=4" alt="Logo" class="brand-logo" onerror="this.src='https://ui-avatars.com/api/?name=RQ&background=ffffff&color=2b394a'">
            <span class="brand-text">RQ Kamila</span>
            <button class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fas fa-border-all"></i> <span>Dashboard</span></a></li>
            <li><a href="data-santri.html"><i class="fas fa-user-graduate"></i> <span>Data Santri</span></a></li>
            <li class="active"><a href="presensi.html"><i class="fas fa-clipboard-list"></i> <span>Input Harian</span></a></li>
            <li><a href="laporan.html"><i class="fas fa-chart-pie"></i> <span>Laporan</span></a></li>
            <li><a href="#"><i class="fas fa-cog"></i> <span>Pengaturan</span></a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <h2 class="page-title">Input Harian</h2>
            </div>
            <div class="topbar-right">
                <button class="btn-save-sm" id="btnBukaModalLibur" style="background-color: #e74c3c; color: white; border-radius: 20px;">
                    <i class="fas fa-calendar-times"></i> Atur Libur
                </button>
            </div>
        </header>

        <div class="dashboard-wrapper">
            
            <div class="card" style="margin-bottom: 20px;">
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 150px;">
                        <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">Tanggal Ngaji</label>
                        <input type="date" id="filterTanggal" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: #f4f7f6;">
                    </div>
                    <div style="flex: 2; min-width: 200px;">
                        <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">Pilih Kelas</label>
                        <select id="filterKelas" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: #f4f7f6;">
                            <option value="">-- Pilih Kelas --</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card" style="padding: 0; overflow: hidden; min-height: 200px;" id="areaFormJurnal">
                <div id="pesanAwal" style="padding: 40px; text-align: center; color: var(--text-muted);">
                    <i class="fas fa-hand-pointer fa-3x" style="margin-bottom: 15px; color: #ddd;"></i><br>
                    Silakan pilih kelas terlebih dahulu.
                </div>

                <div id="pesanLibur" style="display: none;"></div>

                <div id="formInputTable" style="display: none;">
                    
                    <div style="padding: 15px 20px; background: #f8fafc; border-bottom: 1px solid #eee;">
                        <h4 style="margin: 0 0 10px 0; font-size: 0.9rem;">Materi Darsah (Klasikal)</h4>
                        <input type="text" id="inputDarsah" placeholder="Misal: Adab makan dan minum..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                    </div>

                    <div style="overflow-x: auto;">
                        <table class="presensi-table">
                            <thead>
                                <tr>
                                    <th style="min-width: 150px;">Nama Santri</th>
                                    <th>Kehadiran</th>
                                    <th colspan="2">Setoran Tahfidz</th>
                                    <th colspan="2">Setoran Tahsin</th>
                                </tr>
                                <tr style="background: #fff; font-size: 0.75rem;">
                                    <th></th><th>(H/I/S/A)</th>
                                    <th>Surat</th><th>Ayat</th>
                                    <th>Jilid/Surat</th><th>Hal/Ayat</th>
                                </tr>
                            </thead>
                            <tbody id="tbodySantriAbsen">
                                </tbody>
                        </table>
                    </div>
                    
                    <div style="padding: 15px 20px; background: white; text-align: right; border-top: 1px solid #eee;">
                        <button class="btn-save-all" id="btnSimpanJurnal" style="margin: 0;"><i class="fas fa-save"></i> Simpan Semua Data</button>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <script src="presensi.js"></script>
</body>
</html>
